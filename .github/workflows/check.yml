name: Check

# Runs on every pull request and on pushes to main:
# type-checks the project and makes sure the site builds.
on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR cancels the run still in progress
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build
